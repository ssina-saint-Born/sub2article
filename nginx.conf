server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — serves index.html for any unknown route
    # Required even though current app uses state-based tabs (no react-router),
    # future-proofs OAuth hash redirects and any future routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits hashed assets to /assets/ — safe to cache immutably for 1y
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;
}
